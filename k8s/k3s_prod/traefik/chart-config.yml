apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - "--serversTransport.insecureSkipVerify=true"
      - "--entrypoints.web-private.address=:81"
    ports:
      web:
        port: 80
      dashboard:
        port: 8000
      websecure:
        port: 443

      web-private:
        port: 81
        expose:
          default: true
        protocol: TCP

    api:
      insecure: true
      dashboard: true