additionalArguments:
  - --metrics.prometheus.entryPoint=websecure
  - --metrics.prometheus.addEntryPointsLabels=true
  - --metrics.prometheus.addServicesLabels=true
  - --providers.kubernetesingress.ingressendpoint.publishedservice=default/traefik
ports:
  web:
    redirections:
      entryPoint:
        to: websecure
        scheme: https
        permanent: true
  websecure:
    asDefault: true
ingressClass:
  enabled: false

rbac:
  enabled: true
  namespaced: true

service:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.60