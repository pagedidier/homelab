apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cert-manager-letsencrypt-issuer-prod
  namespace: cert-manager
spec:
  acme:
    email: d+letsencrypt@twop.ch
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: cert-manager-letsencrypt-issuer-key
    solvers:
      - http01:
          ingress:
            class: traefik