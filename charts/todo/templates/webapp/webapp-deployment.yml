apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-webapp-{{ .Values.environment }}
  labels:
    app: {{ .Chart.Name }}
spec:
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-webapp-{{ .Values.environment }}
  replicas: {{ .Values.webapp.replicas }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-webapp-{{ .Values.environment }}
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/role: {{ .Chart.Name }}-webapp-{{ .Values.environment }}-role
        vault.hashicorp.com/agent-inject-template-config: |-
          {{`{{ with secret "projects/data/`}}{{ .Chart.Name }}{{`/`}}{{ .Values.environment }}{{`/`}}{{`/webapp" }}
              {{ range $k, $v := .Data.data }}
                  export {{ $k }}="{{ $v }}"
              {{ end }}
          {{ end }}`}}
    spec:
      serviceAccountName: vault
      imagePullSecrets:
          - name: regcred-{{ .Chart.Name }}
      containers:
        - name: {{ .Chart.Name }}-webapp-{{ .Values.environment }}
          imagePullPolicy: Always
          image: registry.gitlab.com/two-p/{{ .Chart.Name }}/webapp:{{ .Values.version }}
          command:
            [ 'bash', '-c' ]
          args:
            [ 'source /vault/secrets/config && /scripts/env.sh && nginx -g "daemon off;"' ]
          ports:
            - name: webapp-port
              containerPort: 80
          resources:
            limits:
              memory: {{ .Values.webapp.resources.memory.limit}}
            requests:
              memory: {{ .Values.webapp.resources.memory.request }}
          livenessProbe:
            httpGet:
              path: /
              port: webapp-port
            initialDelaySeconds: 5
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: webapp-port
            initialDelaySeconds: 5
            periodSeconds: 3