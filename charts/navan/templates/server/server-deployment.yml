apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-server-{{ .Values.environment }}
  labels:
    app: {{ .Chart.Name }}
spec:
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-server-{{ .Values.environment }}
  replicas: {{ .Values.server.replicas }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-server-{{ .Values.environment }}
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/role: {{ .Chart.Name }}-server-{{ .Values.environment }}
        vault.hashicorp.com/agent-inject-template-config: |-
          {{`{{ with secret "projects/data/`}}{{ .Chart.Name }}{{`/`}}{{ .Values.environment }}{{`/`}}{{`/server" }}
              {{ range $k, $v := .Data.data }}
                  export {{ $k }}="{{ $v }}"
              {{ end }}
          {{ end }}`}}
    spec:
      serviceAccountName: vault-{{ .Chart.Name }}
      imagePullSecrets:
          - name: regcred-{{ .Chart.Name }}
      containers:
        - name: {{ .Chart.Name }}-server-{{ .Values.environment }}
          imagePullPolicy: Always
          image: registry.gitlab.com/two-p/{{ .Chart.Name }}/server:{{ .Values.version }}
          env:
            - name: PRE_RUN_COMMAND
              value: 'cat /vault/secrets/config && . /vault/secrets/config'
          ports:
            - name: server-port
              containerPort: 8080
          resources:
            limits:
              memory: {{ .Values.server.resources.memory.limit}}
            requests:
              memory: {{ .Values.server.resources.memory.request }}
#          livenessProbe:
#            httpGet:
#              path: /
#              port: api-port
#            initialDelaySeconds: 5
#            periodSeconds: 3
#          readinessProbe:
#            httpGet:
#              path: /
#              port: api-port
#            initialDelaySeconds: 5
#            periodSeconds: 3