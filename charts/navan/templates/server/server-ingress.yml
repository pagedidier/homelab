apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-server-ingress-{{ .Values.environment }}
  annotations:
    kubernetes.io/ingress.ingressClassName: "traefik"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Chart.Name }}-stripprefixapi@kubernetescrd
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.entrypoint }}
spec:
  rules:
    - host: "{{ .Values.domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Chart.Name }}-server-service-{{ .Values.environment }}
                port:
                  name: service-server-port