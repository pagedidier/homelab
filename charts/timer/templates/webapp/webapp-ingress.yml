apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-webapp-ingress
  annotations:
    kubernetes.io/ingress.ingressClassName: "traefik"
spec:
  rules:
    - host: "{{ .Values.domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Chart.Name }}-webapp-service
                port:
                  number: 80