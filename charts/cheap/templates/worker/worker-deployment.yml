apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-worker-{{ .Values.environment }}
  labels:
    app: {{ .Chart.Name }}
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-worker-{{ .Values.environment }}
  replicas: {{ .Values.worker.replicas }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-worker-{{ .Values.environment }}
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/role: {{ .Chart.Name }}-worker-{{ .Values.environment }}
        vault.hashicorp.com/auth-path: "auth/kubernetes/k3s_prod"
        vault.hashicorp.com/agent-inject-template-config: |-
          {{`{{ with secret "projects/data/`}}{{ .Chart.Name }}{{`/`}}{{ .Values.environment }}{{`/worker" }}
              {{ range $k, $v := .Data.data }}
                  export {{ $k }}="{{ $v }}"
              {{ end }}
          {{ end }}`}}
    spec:
      serviceAccountName: vault-{{ .Chart.Name }}
      imagePullSecrets:
        - name: regcred-{{ .Chart.Name }}
      containers:
        - name: {{ .Chart.Name }}-worker-{{ .Values.environment }}
          imagePullPolicy: Always
          image: "registry.gitlab.com/two-p/{{ .Chart.Name }}/api:{{ .Values.version }}"
          command:
            [ "/bin/sh", "-c" ]
          args:
            [ ". /vault/secrets/config && npm run generate && npx prisma migrate deploy && npm run start" ]
          ports:
            - name: worker-port
              containerPort: 3000
          resources:
            limits:
              memory: {{ .Values.worker.resources.memory.limit}}
            requests:
              memory: {{ .Values.worker.resources.memory.request }}
  #          livenessProbe:
  #            httpGet:
  #              path: /
  #              port: worker-port
  #            initialDelaySeconds: 5
  #            periodSeconds: 3
  #          readinessProbe:
  #            httpGet:
  #              path: /
  #              port: worker-port
  #            initialDelaySeconds: 5
  #            periodSeconds: 3