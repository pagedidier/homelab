image: alpine:3.20.1

stages:
  - deploy

variables:
  VERSION:
    description: "The docker image version"
  ENVIRONMENT:
    description: "The enviorment where to deploy (k8s namespace)"

deploy-timer-chart:
  stage: deploy
  script:
    - apk add --no-cache helm --repository http://dl-3.alpinelinux.org/alpine/edge/community/ yq
    - ENV_UPPER=$(echo $ENVIRONMENT | tr '[:lower:]' '[:upper:]')
    - VAR_NAME="KUBECONFIG_$ENV_UPPER"
    - eval KUBECONFIG_CONTENT=\$$VAR_NAME
    - echo $KUBECONFIG_CONTENT | base64 -d > kubeconfig.yml
    - chmod 600 kubeconfig.yml
    - export KUBECONFIG=./kubeconfig.yml
    - |-
      tee cicd-values.yaml <<EOF
      version: "$VERSION"
      EOF
    - yq '. *= load("cicd-values.yaml")' ./k8s/timer/timer.$ENVIRONMENT.values.yaml > values.yaml
    - helm upgrade --install timer ./charts/timer/ --values=values.yaml -n $ENVIRONMENT