image: alpine:3.18

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - validate_infra
  - plan_infra
  - apply_infra
  - generate_inventory_infra
  - ansible
  - generate_inventory_platform
  - validate_platform
  - plan_platform
  - apply_platform
  - update

.install_just: &install_just
  - apk add --no-cache just bash python3 py3-pip

.install_vault: &install_vault
  - apk add --no-cache curl unzip
  - curl -fsSL https://releases.hashicorp.com/vault/1.21.1/vault_1.21.1_linux_amd64.zip -o vault.zip
  - unzip vault.zip -d vault
  - mv vault/vault /usr/local/bin/
  - vault login -no-print $(vault write -field=token auth/approle/gitlab_repo/login role_id=$VAULT_ROLE_ID secret_id=$VAULT_SECRET_ID)

.install_terraform: &install_terraform
  - apk add --no-cache curl unzip
  - curl -fsSL https://releases.hashicorp.com/terraform/1.14.3/terraform_1.14.3_linux_amd64.zip -o terraform.zip
  - unzip terraform.zip -d terraform
  - mv terraform/terraform /usr/local/bin/

.get_vault_secrets: &get_vault_secrets
  - apk add --no-cache jq
  - ./.ci/retrieve_secrets.sh homelab

.default_terraform_setup_infra: &terraform_setup_infra
  - cd terraform/infra
  - terraform init -backend-config=backend-config.json
  - apk add --no-cache openssh
  - eval $(ssh-agent -s)
  - echo "$SSH_PRIVATE_KEY" | base64 -d | tr -d '\r' | ssh-add -

.default_terraform_setup_plateform: &terraform_setup_plateform
  - cd terraform/platform
  - terraform init -backend-config=backend-config.json
  - mkdir -p ~/.kube
  - echo $KUBECONFIG_CONTENT | base64 -d > ~/.kube/config

generate_inventory_infra:
  stage: generate_inventory_infra
  before_script:
    - *install_just
    - *install_terraform
    - *install_vault
    - *get_vault_secrets
    - *terraform_setup_infra
  script:
    - just generate_inventory_infra
  artifacts:
    paths:
      - ansible/inventory/inventory.yaml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/infra/**
    - when: never

generate_inventory_platform:
  stage: generate_inventory_platform
  before_script:
    - *install_just
    - *install_terraform
    - *install_vault
    - *get_vault_secrets
    - *terraform_setup_infra
  script:
    - just generate_inventory_platform
  artifacts:
    paths:
      - terraform/platform/inventory.yaml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/infra/**

    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/infra/**
        - ansible/playbooks/servers/**
    - when: never

validate_infra:
  stage: validate_infra
  before_script:
    - *install_vault
    - *install_terraform
    - *get_vault_secrets
    - *terraform_setup_infra
  script:
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/infra/**
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - terraform/infra/**
    - when: never

plan_infra:
  stage: plan_infra
  needs: [ validate_infra ]
  before_script:
    - *install_vault
    - *install_terraform
    - *get_vault_secrets
    - *terraform_setup_infra
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - terraform/infra/tfplan
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/infra/**

    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/infra/**
    - when: never

apply_infra:
  stage: apply_infra
  when: manual
  needs: [ plan_infra ]
  before_script:
    - *install_vault
    - *install_terraform
    - *get_vault_secrets
    - *terraform_setup_infra
  script:
    - terraform apply -auto-approve tfplan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/infra/**
    - when: never

validate_platform:
  stage: validate_platform
  before_script:
    - *install_vault
    - *install_terraform
    - *get_vault_secrets
    - *terraform_setup_plateform
  script:
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/platform/**
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - terraform/platform/**
    - when: never

plan_platform:
  stage: plan_platform
  needs: [ validate_platform, generate_inventory_platform ]
  before_script:
    - *install_vault
    - *install_terraform
    - *get_vault_secrets
    - *terraform_setup_plateform
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - terraform/platform/tfplan
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/platform/**
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/platform/**
    - when: never

apply_platform:
  stage: apply_platform
  when: manual
  needs: [ plan_platform ]
  before_script:
    - *install_vault
    - *install_terraform
    - *get_vault_secrets
    - *terraform_setup_plateform
  script:
    - terraform apply -auto-approve tfplan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/platform/**
    - when: never

