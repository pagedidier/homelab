image: alpine:3.18

stages:
  - init
  - plan
  - apply  
  - deploy
  - ansible

variables:
  INFOMANIAK_PROVIDER_VERSION: "0.0.1"
validate_infra:
  stage: init
  before_script:
    - apk add --no-cache --repository http://dl-3.alpinelinux.org/alpine/edge/community/ terraform
    - cd terraform/infra
    - mkdir /local_providers
    - wget -q "https://sos-ch-gva-2.exo.io/rp-test/terraform-provider-infomaniak/${INFOMANIAK_PROVIDER_VERSION}/terraform-provider-infomaniak_${INFOMANIAK_PROVIDER_VERSION}_linux_amd64" -O /local_providers/terraform-provider-infomaniak
    - chmod +x /local_providers/terraform-provider-infomaniak
    - rm .terraform.lock.hcl
    - echo "$TF_BACKEND_HCL_INFRA" | base64 -d > backend.hcl
    - export TF_CLI_CONFIG_FILE=".terraform.rc"
    - terraform init -backend-config=backend.hcl
  script:
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - terraform/infra/**

plan_infra:
  stage: plan
  needs: [validate_infra]
  before_script:
    - apk add --no-cache --repository http://dl-3.alpinelinux.org/alpine/edge/community/ terraform
    - cd terraform/infra
    - mkdir /local_providers
    - wget -q "https://sos-ch-gva-2.exo.io/rp-test/terraform-provider-infomaniak/${INFOMANIAK_PROVIDER_VERSION}/terraform-provider-infomaniak_${INFOMANIAK_PROVIDER_VERSION}_linux_amd64" -O /local_providers/terraform-provider-infomaniak
    - chmod +x /local_providers/terraform-provider-infomaniak
    - export TF_CLI_CONFIG_FILE=".terraform.rc"
    - echo "$TF_BACKEND_HCL_INFRA" | base64 -d > backend.hcl
    - terraform init -backend-config=backend.hcl
    - mkdir -p ~/.ssh
    - echo "$SSH_KEY" | base64 -d > ~/.ssh/private
    - echo "$TF_VARIABLES_INFRA" | base64 -d > variables.auto.tfvars.json
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - terraform/infra/tfplan
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - terraform/infra/**
apply_infra:
  stage: apply
  when: manual
  needs: [plan_infra]
  before_script:
    - apk add --no-cache --repository http://dl-3.alpinelinux.org/alpine/edge/community/ terraform
    - cd terraform/infra
    - mkdir /local_providers
    - wget -q "https://sos-ch-gva-2.exo.io/rp-test/terraform-provider-infomaniak/${INFOMANIAK_PROVIDER_VERSION}/terraform-provider-infomaniak_${INFOMANIAK_PROVIDER_VERSION}_linux_amd64" -O /local_providers/terraform-provider-infomaniak
    - chmod +x /local_providers/terraform-provider-infomaniak
    - echo "$TF_BACKEND_HCL_INFRA" | base64 -d > backend.hcl
    - export TF_CLI_CONFIG_FILE=".terraform.rc"
    - terraform init -backend-config=backend.hcl
    - mkdir -p ~/.ssh
    - echo "$SSH_KEY" | base64 -d > ~/.ssh/private
    - echo "$TF_VARIABLES_INFRA" | base64 -d > variables.auto.tfvars.json
  script:
    - terraform apply -auto-approve tfplan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - terraform/infra/**
validate_platform:
  stage: init
  before_script:
    - apk add --no-cache --repository http://dl-3.alpinelinux.org/alpine/edge/community/ terraform
    - cd terraform/platform
    - echo "$TF_BACKEND_HCL_platform" | base64 -d > backend.hcl
    - terraform init -backend-config=backend.hcl
  script:
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - terraform/platform/**
plan_platform:
  stage: plan
  needs: [validate_platform]
  before_script:
    - apk add --no-cache --repository http://dl-3.alpinelinux.org/alpine/edge/community/ terraform
    - cd terraform/platform
    - echo "$TF_BACKEND_HCL_platform" | base64 -d > backend.hcl
    - terraform init -backend-config=backend.hcl
    - echo "$TF_VARIABLES_PLATEFORM" | base64 -d > variables.auto.tfvars.json
    - mkdir -p ~/.kube
    - echo $KUBECONFIG_CONTENT | base64 -d > ~/.kube/config
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - terraform/platform/tfplan
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - terraform/platform/**
apply_platform:
  stage: apply
  when: manual
  needs: [plan_platform]
  before_script:
    - apk add --no-cache --repository http://dl-3.alpinelinux.org/alpine/edge/community/ terraform
    - cd terraform/platform
    - echo "$TF_BACKEND_HCL_platform" | base64 -d > backend.hcl
    - terraform init -backend-config=backend.hcl
    - echo "$TF_VARIABLES_PLATEFORM" | base64 -d > variables.auto.tfvars.json
    - mkdir -p ~/.kube
    - echo $KUBECONFIG_CONTENT | base64 -d > ~/.kube/config
  script:
    - terraform apply -auto-approve tfplan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - terraform/platform/**
deploy-chart:
  stage: deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
      when: always
    - when: never
  before_script:
    - apk add --no-cache helm --repository http://dl-3.alpinelinux.org/alpine/edge/community/ yq
    - echo $KUBECONFIG_CONTENT | base64 -d > kubeconfig.yml
    - chmod 600 kubeconfig.yml
    - export KUBECONFIG=./kubeconfig.yml
    - |-
      tee cicd-values.yaml <<EOF
      version: "$VERSION"
      EOF
  script:
    - yq '. *= load("cicd-values.yaml")' ./k8s/$PROJECT/$PROJECT.$ENVIRONMENT.values.yaml > values.yaml
    - yq -i ".appVersion = \"$VERSION\"" ./charts/$PROJECT/Chart.yaml
    - helm upgrade --install $PROJECT-$ENVIRONMENT ./charts/$PROJECT/ --values=values.yaml -n $PROJECT
deploy-ansible:
  stage: ansible
  before_script:
    - apk add jq yq python3 py3-pip openssh --repository http://dl-3.alpinelinux.org/alpine/edge/community/ terraform
    - pip install ansible
    - mkdir -p ~/.ssh
    - echo "$SSH_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile=/dev/null" > ~/.ssh/config
    - cd terraform/infra
    - echo "$TF_BACKEND_HCL_INFRA" | base64 -d > backend.hcl
    - terraform init -backend-config=backend.hcl
    - cd ../../ansible
    - sh generate_inventory.sh
    - chmod o-w .
  script:
    - ansible-playbook playbooks/site-homelab.yaml -i inventory/inventory.yaml