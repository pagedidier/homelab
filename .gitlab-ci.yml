image: alpine:3.18

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - validate
  - plan
  - apply
  - generate_inventory_infra
  - deploy
  - ansible
  - generate_inventory_platform

.install_just: &install_just
  - apk add just bash

.install_vault: &install_vault
  - apk add --no-cache curl unzip
  - curl -fsSL https://releases.hashicorp.com/vault/1.21.1/vault_1.21.1_linux_amd64.zip -o vault.zip
  - unzip vault.zip -d vault
  - mv vault/vault /usr/local/bin/
  - vault login -no-print $(vault write -field=token auth/approle/gitlab_repo/login role_id=$VAULT_ROLE_ID secret_id=$VAULT_SECRET_ID)

.install_terraform: &install_terraform
  - curl -fsSL https://releases.hashicorp.com/terraform/1.14.3/terraform_1.14.3_linux_amd64.zip -o terraform.zip
  - unzip terraform.zip -d terraform
  - mv terraform/terraform /usr/local/bin/

.get_vault_secrets: &get_vault_secrets
  - apk add --no-cache jq
  - ./.ci/retrieve_secrets.sh homelab

.default_terraform_setup_infra: &terraform_setup_infra
  - cd terraform/infra
  - terraform init -backend-config=backend-config.json
  - apk add --no-cache openssh
  - eval $(ssh-agent -s)
  - echo "$SSH_PRIVATE_KEY" | base64 -d | tr -d '\r' | ssh-add -

.default_terraform_setup_plateform: &terraform_setup_plateform
  - cd terraform/platform
  - terraform init -backend-config=backend-config.json
  - mkdir -p ~/.kube
  - echo $KUBECONFIG_CONTENT | base64 -d > ~/.kube/config

test:
  stage: test
  before_script:
    - *install_just
    - *install_terraform
    - *get_vault_secrets
    - *terraform_setup_infra
  script:
    - just generate_inventory_infra


validate_infra:
  stage: validate
  before_script:
    - *install_vault
    - *install_terraform
    - *get_vault_secrets
    - *terraform_setup_infra
  script:
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/infra/**
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - terraform/infra/**
    - when: never



plan_infra:
  stage: plan
  needs: [ validate_infra ]
  before_script:
    - *install_vault
    - *install_terraform
    - *get_vault_secrets
    - *terraform_setup_infra
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - terraform/infra/tfplan
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/infra/**

    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/infra/**
    - when: never

apply_infra:
  stage: apply
  when: manual
  needs: [ plan_infra ]
  before_script:
    - *install_vault
    - *install_terraform
    - *get_vault_secrets
    - *terraform_setup_infra
  script:
    - terraform apply -auto-approve tfplan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/infra/**
    - when: never

validate_platform:
  stage: validate
  before_script:
    - *install_vault
    - *install_terraform
    - *get_vault_secrets
    - *terraform_setup_plateform
  script:
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/platform/**
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - terraform/platform/**
    - when: never

plan_platform:
  stage: plan
  needs: [ validate_platform ]
  before_script:
    - *install_vault
    - *install_terraform
    - *get_vault_secrets
    - *terraform_setup_plateform
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - terraform/platform/tfplan
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - terraform/platform/**

    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/platform/**
    - when: never

apply_platform:
  stage: apply
  when: manual
  needs: [ plan_platform ]
  before_script:
    - *install_vault
    - *install_terraform
    - *get_vault_secrets
    - *terraform_setup_plateform
  script:
    - terraform apply -auto-approve tfplan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - terraform/platform/**
    - when: never




deploy-chart:
  stage: deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
      when: always
    - when: never
  before_script:
    - apk add --no-cache helm --repository http://dl-3.alpinelinux.org/alpine/edge/community/ yq
    - echo $KUBECONFIG_CONTENT | base64 -d > kubeconfig.yml
    - chmod 600 kubeconfig.yml
    - export KUBECONFIG=./kubeconfig.yml
    - |-
      tee cicd-values.yaml <<EOF
      version: "$VERSION"
      EOF
  script:
    - yq '. *= load("cicd-values.yaml")' ./k8s/$PROJECT/$PROJECT.$ENVIRONMENT.values.yaml > values.yaml
    - yq -i ".appVersion = \"$VERSION\"" ./charts/$PROJECT/Chart.yaml
    - helm upgrade --install $PROJECT-$ENVIRONMENT ./charts/$PROJECT/ --values=values.yaml -n $PROJECT

deploy-ansible:
  stage: ansible
  before_script:
    - apk add jq yq python3 py3-pip openssh --repository http://dl-3.alpinelinux.org/alpine/edge/community/ terraform
    - pip install ansible
    - mkdir -p ~/.ssh
    - echo "$SSH_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile=/dev/null" > ~/.ssh/config
    - cd terraform/infra
    - echo "$TF_BACKEND_HCL_INFRA" | base64 -d > backend-config.json
    - terraform init -backend-config=backend-config.json
  script:
    - ansible-playbook playbooks/site-homelab.yaml -i inventory/inventory.yaml
  needs:
    - job: apply_infra
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ansible/**/*
    - if: '$CI_JOB_STATUS == "success"'
      needs:
        - apply_infra
    - when: never
