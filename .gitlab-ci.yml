image: alpine:3.18

stages:
  - validate
  - plan
  - apply  
  - deploy
  - ansible

.default_terraform_setup_infra: &terraform_setup_infra
  - apk add --no-cache --repository http://dl-3.alpinelinux.org/alpine/edge/community/ terraform
  - cd terraform/infra
  - echo "$TF_BACKEND_HCL_INFRA" | base64 -d > backend.hcl
  - export TF_CLI_CONFIG_FILE=".terraform.rc"
  - terraform init -backend-config=backend.hcl
  - mkdir -p ~/.ssh
  - echo "$SSH_KEY" | base64 -d > ~/.ssh/private
  - echo "$TF_VARIABLES_INFRA" | base64 -d > variables.auto.tfvars.json

.default_terraform_setup_plateform: &terraform_setup_plateform
  - apk add --no-cache --repository http://dl-3.alpinelinux.org/alpine/edge/community/ terraform
  - cd terraform/platform
  - echo "$TF_BACKEND_HCL_platform" | base64 -d > backend.hcl
  - terraform init -backend-config=backend.hcl
  - echo "$TF_VARIABLES_PLATEFORM" | base64 -d > variables.auto.tfvars.json
  - mkdir -p ~/.kube
  - echo $KUBECONFIG_CONTENT | base64 -d > ~/.kube/config

validate_infra:
  stage: validate
  before_script:
    - *terraform_setup_infra
  script:
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - terraform/infra/**

plan_infra:
  stage: plan
  needs: [validate_infra]
  before_script:
    - *terraform_setup_infra
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - terraform/infra/tfplan
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - terraform/infra/**

apply_infra:
  stage: apply
  when: manual
  needs: [plan_infra]
  before_script:
    - *terraform_setup_infra
  script:
    - terraform apply -auto-approve tfplan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - terraform/infra/**

validate_platform:
  stage: validate
  before_script:
    - *terraform_setup_plateform
  script:
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - terraform/platform/**

plan_platform:
  stage: plan
  needs: [validate_platform]
  before_script:
    - *terraform_setup_plateform
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - terraform/platform/tfplan
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - terraform/platform/**

apply_platform:
  stage: apply
  when: manual
  needs: [plan_platform]
  before_script:
    - *terraform_setup_plateform
  script:
    - terraform apply -auto-approve tfplan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - terraform/platform/**

deploy-chart:
  stage: deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
      when: always
    - when: never
  before_script:
    - apk add --no-cache helm --repository http://dl-3.alpinelinux.org/alpine/edge/community/ yq
    - echo $KUBECONFIG_CONTENT | base64 -d > kubeconfig.yml
    - chmod 600 kubeconfig.yml
    - export KUBECONFIG=./kubeconfig.yml
    - |-
      tee cicd-values.yaml <<EOF
      version: "$VERSION"
      EOF
  script:
    - yq '. *= load("cicd-values.yaml")' ./k8s/$PROJECT/$PROJECT.$ENVIRONMENT.values.yaml > values.yaml
    - yq -i ".appVersion = \"$VERSION\"" ./charts/$PROJECT/Chart.yaml
    - helm upgrade --install $PROJECT-$ENVIRONMENT ./charts/$PROJECT/ --values=values.yaml -n $PROJECT

deploy-ansible:
  stage: ansible
  before_script:
    - apk add jq yq python3 py3-pip openssh --repository http://dl-3.alpinelinux.org/alpine/edge/community/ terraform
    - pip install ansible
    - mkdir -p ~/.ssh
    - echo "$SSH_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile=/dev/null" > ~/.ssh/config
    - cd terraform/infra
    - echo "$TF_BACKEND_HCL_INFRA" | base64 -d > backend.hcl
    - terraform init -backend-config=backend.hcl
    - cd ../../ansible
    - sh generate_inventory.sh
    - chmod o-w .
  script:
    - ansible-playbook playbooks/site-homelab.yaml -i inventory/inventory.yaml