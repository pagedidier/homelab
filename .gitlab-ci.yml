image: alpine:3.18

stages:
  - init
  - plan
  - apply  
  - deploy

before_script:
  - apk add --no-cache --repository http://dl-3.alpinelinux.org/alpine/edge/community/ terraform

validate_infra:
  stage: init
  script:
    - cd terraform/infra
    - echo "$TF_BACKEND_HCL_INFRA" | base64 -d > backend.hcl
    - terraform init -backend-config=backend.hcl
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - terraform/infra/**

plan_infra:
  stage: plan
  needs: [validate_infra]
  script:
    - cd terraform/infra
    - echo "$TF_BACKEND_HCL_INFRA" | base64 -d > backend.hcl
    - mkdir -p ~/.ssh
    - echo "$SSH_KEY" | base64 -d > ~/.ssh/private
    - terraform init -backend-config=backend.hcl
    - echo "$TF_VARIABLES_INFRA" | base64 -d > variables.auto.tfvars.json
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - terraform/infra/tfplan
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - changes:
        - terraform/infra/**
apply_infra:
  stage: apply
  when: manual
  needs: [plan_infra]
  script:
    - cd terraform/infra
    - echo "$TF_BACKEND_HCL_INFRA" | base64 -d > backend.hcl
    - terraform init -backend-config=backend.hcl
    - mkdir -p ~/.ssh
    - echo "$SSH_KEY" | base64 -d > ~/.ssh/private
    - echo "$TF_VARIABLES_INFRA" | base64 -d > variables.auto.tfvars.json
    - terraform apply -auto-approve tfplan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - changes:
        - terraform/infra/**
validate_plateform:
  stage: init
  script:
    - cd terraform/plateform
    - echo "$TF_BACKEND_HCL_PLATEFORM" | base64 -d > backend.hcl
    - terraform init -backend-config=backend.hcl
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - changes:
        - terraform/plateform/**
plan_plateform:
  stage: plan
  needs: [validate_plateform]
  script:
    - cd terraform/plateform
    - echo "$TF_BACKEND_HCL_PLATEFORM" | base64 -d > backend.hcl
    - terraform init -backend-config=backend.hcl
    - echo "$TF_VARIABLES_PLATEFORM" | base64 -d > variables.auto.tfvars.json
    - mkdir -p ~/.kube
    - echo $KUBECONFIG_CONTENT | base64 -d > ~/.kube/config
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - terraform/plateform/tfplan
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - changes:
        - terraform/plateform/**
apply_plateform:
  stage: apply
  when: manual
  needs: [plan_plateform]
  script:
    - cd terraform/plateform
    - echo "$TF_BACKEND_HCL_PLATEFORM" | base64 -d > backend.hcl
    - terraform init -backend-config=backend.hcl
    - echo "$TF_VARIABLES_PLATEFORM" | base64 -d > variables.auto.tfvars.json
    - mkdir -p ~/.kube
    - echo $KUBECONFIG_CONTENT | base64 -d > ~/.kube/config
    - terraform apply -auto-approve tfplan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - changes:
        - terraform/plateform/**
deploy-chart:
  stage: deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
      when: always
    - when: never
  script:
    - apk add --no-cache helm --repository http://dl-3.alpinelinux.org/alpine/edge/community/ yq
    - echo $KUBECONFIG_CONTENT | base64 -d > kubeconfig.yml
    - chmod 600 kubeconfig.yml
    - export KUBECONFIG=./kubeconfig.yml
    - |-
      tee cicd-values.yaml <<EOF
      version: "$VERSION"
      EOF
    - yq '. *= load("cicd-values.yaml")' ./k8s/$PROJECT/$PROJECT.$ENVIRONMENT.values.yaml > values.yaml
    - yq -i ".appVersion = \"$VERSION\"" ./charts/$PROJECT/Chart.yaml
    - helm upgrade --install $PROJECT-$ENVIRONMENT ./charts/$PROJECT/ --values=values.yaml -n $PROJECT