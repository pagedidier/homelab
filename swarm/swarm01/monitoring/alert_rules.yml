groups:
  - name: uptime_alerts
    rules:
      - alert: EndpointDown
        expr: probe_http_status_code != 200
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint {{ $labels.instance }} is down"
          description: "Service has been unreachable for more than 2 minutes. ({{ $value }})"