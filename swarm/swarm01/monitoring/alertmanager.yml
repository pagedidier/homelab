global:
  resolve_timeout: 5m

route:
  group_by: [ 'alertname', 'instance' ]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 3h
  receiver: 'telegram-notifications'

receivers:
  - name: 'telegram-notifications'
    telegram_configs:
      - bot_token: '8215671430:AAHq_TmRLLOXPsJ6GSoz-RD-i_Fh9yx3Klw'
        chat_id: 152248148
        send_resolved: true
        parse_mode: 'HTML'
        message: |
          {{ if eq .Status "firing" }}🔥 <b>ALARM</b>{{ else }}✅ <b>RESOLVED</b>{{ end }}
          {{ range .Alerts }}
          ---
          <b>Endpoint:</b> {{ .Labels.instance }}
          <b>Summary:</b> {{ .Annotations.summary }}
          <b>Details:</b> {{ .Annotations.description }}
          {{ end }}