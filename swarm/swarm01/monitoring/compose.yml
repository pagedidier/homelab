services:
  prometheus:
    image: prom/prometheus:v3.9.1
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.prometheus.rule=Host(`prometheus.twop.ch`)"
        - "traefik.http.routers.prometheus.entrypoints=web-private"
        - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    user: "0:0"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=60d"
    ports:
      - "9090:9090"
    networks:
      - traefik_proxy
      - monitoring

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    ports:
      - "9115:9115"
    configs:
      - source: blackbox_config
        target: /etc/blackbox/blackbox.yml
    networks:
      - monitoring
configs:
  prometheus_config:
    file: ./prometheus.yml
  blackbox_config:
    file: ./blackbox.yml

volumes:
  prometheus:
    driver_opts:
      type: "nfs"
      o: "addr=192.168.0.92,rw,nfsvers=3"
      device: ":/mnt/main/swarm01/prometheus"

networks:
  monitoring:
    external: false
  traefik_proxy:
    external: true