configs:
  prometheus_config:
    file: ./prometheus.yml
  blackbox_config:
    file: ./blackbox.yml
  alertmanager_config:
    file: ./alertmanager.yml
  alert_rules:
    file: ./alert_rules.yml
volumes:
  prometheus:
    driver_opts:
      type: "nfs"
      o: "addr=192.168.0.92,rw,nfsvers=3"
      device: ":/mnt/main/swarm01/prometheus"

networks:
  monitoring:
    external: false
  traefik_proxy:
    external: true