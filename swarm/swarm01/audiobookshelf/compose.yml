services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.28.0
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.audio.rule=Host(`audio.twop.ch`)"
        - "traefik.http.routers.audio.entrypoints=web"
        - "traefik.http.services.audio.loadbalancer.server.port=80"
    ports:
      - "13378:80"
    restart: unless-stopped
    volumes:
      - media:/audiobooks:ro
      - /mnt/cephfs/audiobookshelf/config/:/config
      - /mnt/cephfs/audiobookshelf/metadata/:/metadata
    environment:
      - TZ=Europe/Zurich
    networks:
      - traefik_proxy
volumes:
  media:
    driver_opts:
      type: "nfs"
      o: "addr=192.168.0.29,rw,nfsvers=4"
      device: ":/volume1/dpage"

networks:
  traefik_proxy:
    external: true