services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    ports:
      - "32400:32400"
      - "1900:1900/udp"
      - "5353:5353/udp"
      - "8324:8324"
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
      - "32469:32469"
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - TZ=Europe/Zurich
    volumes:
      - /mnt/cephfs/plex/:/config
      - media:/media
    restart: unless-stopped

volumes:
  media:
    driver_opts:
      type: "nfs"
      o: "addr=192.168.0.29,rw,nfsvers=4"
      device: ":/volume1/dpage"