services:
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    ports:
      - "3001:3001"
    volumes:
      - /mnt/cephfs/uptime-kuma/:/app/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.uptime-kuma.rule=Host(`uptimekuma.twop.ch`)"
        - "traefik.http.routers.uptime-kuma.entrypoints=web-private"
        - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"
        - "homepage.group=Monitoring"
        - "homepage.name=Uptimekuma"
        - "homepage.icon=https://uptimekuma.org/wp-content/uploads/2025/01/Uptime-Kuma-Logo.png"
        - "homepage.href=https://uptimekuma.twop.ch"
        - "homepage.description=Uptimekuma"
    restart: unless-stopped
    networks:
      - traefik_proxy

networks:
  traefik_proxy:
    external: true