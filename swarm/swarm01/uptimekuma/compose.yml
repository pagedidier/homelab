services:
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    ports:
      - "3001:3001"
    volumes:
      - /mnt/cephfs/uptime-kuma/:/app/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.uptime-kuma.rule=Host(`uptimekuma.twop.ch`)"
        - "traefik.http.routers.uptime-kuma.entrypoints=web"
        - "traefik.http.services.vault.loadbalancer.server.port=3001"
    restart: unless-stopped
