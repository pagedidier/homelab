services:
  plex:
    image: lscr.io/linuxserver/plex:1.42.1
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    ports:
      - "32400:32400"
      - "1900:1900/udp"
      - "5353:5353/udp"
      - "8324:8324"
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
      - "32469:32469"
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - TZ=Europe/Zurich
    volumes:
      - config:/config
      - /mnt/usb-disk/media:/media
    restart: unless-stopped

volumes:
  config:
    driver: local