global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'proxmox_graphite_exporter'
    metrics_path: "/metrics"
    static_configs:
      - targets:
        - "192.168.0.211:9108"
        - "192.168.0.212:9108"
        - "192.168.0.213:9108"
  - job_name: 'proxmox_node_exporter'
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "192.168.0.211:9100"
          - "192.168.0.212:9100"
          - "192.168.0.213:9100"