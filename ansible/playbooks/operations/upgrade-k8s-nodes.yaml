---
- name: Rolling upgrade - k3s servers
  serial: 1
  become: true
  hosts: init, join
  gather_facts: true
  tasks:

    - name: Check all nodes Ready before upgrade
      delegate_to: localhost
      command: kubectl get nodes --no-headers
      register: node_list
      changed_when: false
      become: false

    - name: Fail if any node not Ready
      delegate_to: localhost
      shell: kubectl get nodes --no-headers | awk '{print $2}' | grep -v Ready || true
      register: not_ready_nodes
      failed_when: not_ready_nodes.stdout != ""
      changed_when: false
      become: false

    - name: Cordon node
      delegate_to: localhost
      command: kubectl cordon {{ inventory_hostname.split('.')[0] }}
      become: false

    - name: Drain node
      delegate_to: localhost
      command: kubectl drain {{ inventory_hostname.split('.')[0] }} --ignore-daemonsets --delete-emptydir-data --force
      become: false

    - name: Apt update
      apt:
        update_cache: yes

    - name: Apt upgrade
      apt:
        upgrade: yes

    - name: Check if reboot required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot if required
      reboot:
        reboot_timeout: 900
      when: reboot_required.stat.exists

    - name: Wait for node to come back
      wait_for_connection:
        timeout: 300

    - name: Wait for k3s service
      systemd:
        name: k3s
        state: started
      register: k3s_status
      retries: 15
      delay: 10
      until: k3s_status is succeeded

    - name: Wait until node is Ready again
      delegate_to: localhost
      shell: kubectl get nodes {{ inventory_hostname.split('.')[0] }} --no-headers | awk '{print $2}'
      register: node_state
      retries: 15
      delay: 10
      until: node_state.stdout == "Ready,SchedulingDisabled"
      become: false

    - name: Uncordon node
      delegate_to: localhost
      command: kubectl uncordon {{ inventory_hostname.split('.')[0] }}
      become: false

    - name: Verify cluster healthy after upgrade
      delegate_to: localhost
      shell: kubectl get nodes --no-headers | awk '{print $2}' | grep -v Ready || true
      register: post_not_ready
      failed_when: post_not_ready.stdout != ""
      changed_when: false
      become: false

    - name: Wait 30 seconds before next node
      pause:
        seconds: 30
      when: inventory_hostname != ansible_play_hosts_all[-1]