- name: Rolling upgrade - Swarm Workers
  hosts: workers
  serial: 1
  become: true
  gather_facts: true

  vars:
    manager_host: "{{ groups['managers'][0] }}"

  tasks:

    - name: Check swarm health before upgrade
      delegate_to: "{{ manager_host }}"
      shell: docker node ls --format '{{ "{{ .Status }}" }}' | grep -v Ready || true
      register: not_ready_nodes
      failed_when: not_ready_nodes.stdout != ""
      changed_when: false

    - name: Get running tasks on this worker
      delegate_to: "{{ manager_host }}"
      shell: docker node ps {{ inventory_hostname.split('.')[0] }} --no-trunc | grep "Running" || true
      register: node_tasks
      changed_when: false


    - name: Extract service names
      set_fact:
        affected_services: >-
          {{
            node_tasks.stdout_lines
            | map('regex_replace', '^\S+\s+(\S+)\s+.*$', '\1')
            | map('regex_replace', '\.\d+$', '')
            | list
            | unique
          }}

    - name: Debug affected services
      debug:
        var: affected_services

    - name: Drain worker node
      delegate_to: "{{ manager_host }}"
      command: docker node update --availability drain {{ inventory_hostname.split('.')[0] }}

    - name: Pause for task migration
      pause:
        seconds: 15

    - name: Apt update
      apt:
        update_cache: yes

    - name: Apt upgrade
      apt:
        upgrade: yes

    - name: Check if reboot required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot if required
      reboot:
        reboot_timeout: 900
      when: reboot_required.stat.exists

    - name: Wait for node to come back
      wait_for_connection:
        timeout: 300

    - name: Wait for Docker to be active
      systemd:
        name: docker
        state: started
      register: docker_started
      retries: 12
      delay: 10
      until: docker_started is succeeded

    - name: Set worker back to active
      delegate_to: "{{ manager_host }}"
      command: docker node update --availability active {{ inventory_hostname.split('.')[0] }}

    - name: Wait until worker is Ready
      delegate_to: "{{ manager_host }}"
      shell: docker node inspect {{ inventory_hostname.split('.')[0] }} --format '{{ "{{ .Status.State }}" }}'
      register: node_state
      retries: 12
      delay: 10
      until: node_state.stdout == "ready"

    - name: Verify swarm healthy after worker upgrade
      delegate_to: "{{ manager_host }}"
      shell: docker node ls --format '{{ "{{ .Status }}" }}' | grep -v Ready || true
      register: post_not_ready
      failed_when: post_not_ready.stdout != ""
      changed_when: false

    - name: Force update affected services to rebalance
      delegate_to: "{{ manager_host }}"
      command: docker service update --force {{ item }}
      loop: "{{ affected_services }}"
      when: affected_services | length > 0

    - name: Pause for task migration
      pause:
        seconds: 15

- name: Upgrade Swarm Manager
  hosts: managers
  serial: 1
  become: true
  gather_facts: true

  tasks:

    - name: Check swarm health before manager upgrade
