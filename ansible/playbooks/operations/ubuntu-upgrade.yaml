---
- name: Update and Upgrade Ubuntu Packages
  become: yes
  hosts: all
  tasks:
    - name: Update apt package lists
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages (dist-upgrade)
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Check if a system reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot the server if kernel or system updates require it
      ansible.builtin.reboot:
        msg: "Rebooting server after package upgrades (managed by Ansible)"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      when: reboot_required_file.stat.exists