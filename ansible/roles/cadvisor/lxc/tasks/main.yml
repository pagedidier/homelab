---
- name: Create application directory
  file:
    path: "/opt/cadvisor_lxc"
    state: directory
    mode: '0755'

- name: Copy Docker Compose file
  template:
    src: compose.yml
    dest: "/opt/cadvisor_lxc/compose.yml"
    mode: '0644'

- name: Restart Docker Compose
  community.docker.docker_compose_v2:
    project_src: "/opt/cadvisor_lxc"
    files:
      - compose.yml
    state: present