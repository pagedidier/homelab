---
- name: Generate K3s token on the first manager node
  set_fact:
    k3s_token: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"

- name: Share K3s token with all nodes
  set_fact:
    k3s_token: "{{ hostvars[groups[k3s_init_group][0]]['k3s_token'] }}"
  run_once: true
  delegate_to: "{{ item }}"
  loop: "{{ groups['k3s_dev'] }}"

- name: Install K3s on the first manager node
  shell: |
    curl -sfL https://get.k3s.io | \
    K3S_TOKEN={{ k3s_token }} \
    sh -s - server \
      --cluster-init \
      --tls-san k3s \
      --disable=traefik
  args:
    creates: /usr/local/bin/k3s